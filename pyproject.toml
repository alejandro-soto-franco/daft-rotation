[build-system]
requires = ["setuptools", "setuptools-rust"]
build-backend = "setuptools.build_meta"

[project]
name = "daft-rotation"
version = "0.1.0"
description = "Quaternion, 6D, and SO(3) rotation expressions for Daft"
authors = [{name = "Alejandro Soto Franco", email = "sotofranco.eng@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["daft"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/alejandrosotofranco/daft-rotation"

[project.optional-dependencies]
test = ["pytest", "numpy"]

[tool.uv.sources]
daft = {path = "../daft", editable = true}
